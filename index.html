<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>GINGA</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #FDFBF7;
            --text-color: #2C3E50;
            --card-bg: rgba(255, 255, 255, 0.8);
            --header-bg: #2D5A27;
            --accent: #E6A800;
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #FFFFFF;
            --card-bg: rgba(40, 40, 40, 0.6);
            --header-bg: #1A3D16;
        }

        body { margin: 0; background-color: #222; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Inter', sans-serif; transition: 0.3s; }
        
        .phone { width: 390px; height: 840px; background-color: var(--bg-color); color: var(--text-color); border-radius: 40px; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.3); transition: 0.3s; }
        
        .header { background-color: var(--header-bg); color: white; padding: 25px 20px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 20px; }
        
        .content { flex: 1; overflow-y: auto; padding: 25px; }

        /* כרטיס Glassmorphism */
        .card { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 25px; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
        
        .nav { height: 80px; background: var(--card-bg); backdrop-filter: blur(15px); border-top: 1px solid rgba(128,128,128,0.1); display: flex; justify-content: space-around; align-items: center; padding-bottom: 10px; }
        .nav a { display: flex; flex-direction: column; align-items: center; color: var(--text-color); text-decoration: none; font-size: 11px; font-weight: 600; opacity: 0.7; }
        .fab { width: 60px; height: 60px; background: var(--header-bg); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: -40px; box-shadow: 0 10px 20px rgba(45,90,39,0.4); }
    </style>
</head>
<body>
    <div class="phone" id="app-container" data-theme="dark">
        <div class="header">
            <span>GINGA</span>
            <button onclick="toggleTheme()" style="background: none; border: none; color: white; cursor: pointer;">
                <i data-lucide="sun-moon"></i>
            </button>
        </div>
        
        <div class="content">
            <div class="card">
                <div style="font-size: 16px;">בוקר טוב, נועה</div>
                <div style="font-size: 13px; opacity: 0.6; margin-bottom: 10px;">רמה 3 - מתחיל+</div>
                <div style="height: 10px; background: rgba(0,0,0,0.1); border-radius: 5px;">
                    <div style="width: 70%; height: 100%; background: var(--accent); border-radius: 5px;"></div>
                </div>
            </div>

            <h3 style="margin-top: 30px;">הדרך שלך לפריסטייל</h3>
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <span style="font-weight: 600;">Double Touch</span>
                    <i data-lucide="play-circle" style="color: var(--accent);"></i>
                </div>
                <div style="font-size: 13px; background: rgba(230, 168, 0, 0.2); padding: 5px 10px; border-radius: 10px; display: inline-block;">+ XP 80</div>
            </div>
        </div>
        
        <nav class="nav">
            <a href="#"><i data-lucide="book-open"></i>תרגול</a>
            <a href="#"><i data-lucide="activity"></i>פעילות</a>
            <a href="#" class="fab"><i data-lucide="plus"></i></a>
            <a href="#"><i data-lucide="map-pin"></i>מפה</a>
            <a href="#"><i data-lucide="user"></i>פרופיל</a>
        </nav>
    </div>

    <script>
        lucide.createIcons();
        function toggleTheme() {
            const container = document.getElementById('app-container');
            const currentTheme = container.getAttribute('data-theme');
            container.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
        }
    </script>
</body>
</html>
