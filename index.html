<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>GINGA</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #FDFBF7;
            --text-color: #2C3E50;
            --card-bg: rgba(255, 255, 255, 0.7);
            --header-bg: #2D5A27;
            --accent: #E6A800;
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #FFFFFF;
            --card-bg: rgba(255, 255, 255, 0.05);
            --header-bg: #1A3D16;
        }

        body { margin: 0; background-color: #222; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Heebo', sans-serif; transition: 0.3s; }
        
        .phone { width: 390px; height: 840px; background-color: var(--bg-color); color: var(--text-color); border-radius: 40px; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.3); transition: 0.3s; }
        
        .header { background-color: var(--header-bg); color: white; padding: 25px 20px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 20px; }
        
        .content { flex: 1; overflow-y: auto; padding: 25px; }

        .card { background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); padding: 22px; border-radius: 28px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        
        .nav { height: 80px; background: var(--card-bg); backdrop-filter: blur(20px); border-top: 1px solid rgba(128,128,128,0.1); display: flex; justify-content: space-around; align-items: center; padding-bottom: 10px; }
        .nav a { display: flex; flex-direction: column; align-items: center; color: var(--text-color); text-decoration: none; font-size: 12px; font-weight: 400; opacity: 0.8; }
        .nav i { margin-bottom: 5px; }
        .fab { width: 60px; height: 60px; background: var(--header-bg); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: -40px; box-shadow: 0 10px 20px rgba(45,90,39,0.3); }
    </style>
</head>
<body>
    <div class="phone" id="app-container" data-theme="dark">
        <div class="header">
            <span>GINGA</span>
            <button onclick="toggleTheme()" style="background: none; border: none; color: white; cursor: pointer;">
                <i data-lucide="sun-moon"></i>
            </button>
        </div>
        
        <div class="content">
            <div class="card">
                <div style="font-weight: 600; font-size: 18px;">בוקר טוב, נועה</div>
                <div style="font-size: 14px; opacity: 0.7; margin-bottom: 15px;">רמה 3 - מתחיל+</div>
                <div style="height: 8px; background: rgba(0,0,0,0.1); border-radius: 4px; overflow: hidden;">
                    <div style="width: 70%; height: 100%; background: var(--accent); border-radius: 4px;"></div>
                </div>
            </div>

            <h3 style="margin: 30px 0 15px 0; font-weight: 600;">הדרך שלך לפריסטייל</h3>
            
            <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div style="font-weight: 600; font-size: 17px; margin-bottom: 5px;">Double Touch</div>
                    <div style="font-size: 13px; background: rgba(230, 168, 0, 0.15); color: var(--accent); padding: 4px 10px; border-radius: 10px; display: inline-block; font-weight: 600;">+ XP 80</div>
                </div>
                <i data-lucide="play-circle" style="color: var(--accent); width: 32px; height: 32px;"></i>
            </div>
        </div>
        
        <nav class="nav">
            <a href="#"><i data-lucide="book-open"></i>תרגול</a>
            <a href="#"><i data-lucide="activity"></i>פעילות</a>
            <a href="#" class="fab"><i data-lucide="plus"></i></a>
            <a href="#"><i data-lucide="map-pin"></i>מפה</a>
            <a href="#"><i data-lucide="user"></i>פרופיל</a>
        </nav>
    </div>

    <script>
        lucide.createIcons();
        function toggleTheme() {
            const container = document.getElementById('app-container');
            const newTheme = container.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            container.setAttribute('data-theme', newTheme);
        }
    </script>
</body>
</html>
