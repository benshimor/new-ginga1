<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>GINGA</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { margin: 0; background-color: #EDE7DB; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Inter', sans-serif; }
        
        .phone { width: 390px; height: 840px; background-color: #FDFBF7; border-radius: 40px; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        .header { background-color: #2D5A27; color: white; padding: 20px; text-align: center; font-weight: 600; font-size: 18px; }
        
        /* אזור תוכן מרכזי */
        .content { flex: 1; overflow-y: auto; padding: 20px; }

        /* ניווט תחתון */
        .nav { height: 70px; background: white; border-top: 1px solid rgba(44,62,80,0.1); display: flex; justify-content: space-around; align-items: center; padding-bottom: 5px; flex-shrink: 0; }
        .nav a { display: flex; flex-direction: column; align-items: center; color: #6B7789; text-decoration: none; font-size: 11px; font-weight: 600; }
        .nav i { margin-bottom: 4px; }
        .fab { width: 54px; height: 54px; background: #2D5A27; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: -30px; box-shadow: 0 6px 15px rgba(45,90,39,0.3); }
    </style>
</head>
<body>
    <div class="phone">
        <div class="header">GINGA</div>
        
        <div class="content">
            <h2 style="color: #2D5A27;">תרגול וטכניקה</h2>
            
            <!-- כרטיס XP -->
            <div style="background: white; padding: 15px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px;">
                <div style="font-size: 14px; color: #6B7789;">רמה: מתחיל | XP: 450</div>
                <div style="height: 10px; background: #eee; border-radius: 5px; margin-top: 10px;">
                    <div style="width: 45%; height: 100%; background: #E6A800; border-radius: 5px;"></div>
                </div>
            </div>

            <!-- טאבים של רמות -->
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button style="flex: 1; padding: 10px; border-radius: 15px; border: none; background: #2D5A27; color: white;">קל</button>
                <button style="flex: 1; padding: 10px; border-radius: 15px; border: 1px solid #ddd; background: transparent;">בינוני</button>
                <button style="flex: 1; padding: 10px; border-radius: 15px; border: 1px solid #ddd; background: transparent;">קשה</button>
            </div>

            <!-- דוגמה לטריק -->
            <div style="background: white; border: 1px solid #eee; padding: 15px; border-radius: 20px;">
                <div style="width: 100%; height: 150px; background: #ddd; border-radius: 15px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">וידאו הדגמה</div>
                <h3 style="margin: 0;">אלטיניה בסיסית</h3>
                <p style="font-size: 12px; color: #6B7789;">הטריק הראשון ללמידה</p>
            </div>
        </div>
        
        <nav class="nav">
            <a href="#"><i data-lucide="book-open"></i>תרגול</a>
            <a href="#"><i data-lucide="activity"></i>פעילות</a>
            <a href="#" class="fab"><i data-lucide="plus"></i></a>
            <a href="#"><i data-lucide="map-pin"></i>מפה</a>
            <a href="#"><i data-lucide="user"></i>פרופיל</a>
        </nav>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
