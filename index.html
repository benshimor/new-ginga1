<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>GINGA</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* הגדרת משתני עיצוב למצבים */
        :root {
            --bg-color: #FDFBF7;
            --text-color: #2C3E50;
            --card-bg: #FFFFFF;
            --header-bg: #2D5A27;
            --accent: #E6A800;
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #FFFFFF;
            --card-bg: #1E1E1E;
            --header-bg: #1A3D16;
            --accent: #E6A800;
        }

        body { margin: 0; background-color: #EDE7DB; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Inter', sans-serif; transition: 0.3s; }
        
        .phone { width: 390px; height: 840px; background-color: var(--bg-color); color: var(--text-color); border-radius: 40px; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition: 0.3s; }
        
        .header { background-color: var(--header-bg); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
        
        .content { flex: 1; overflow-y: auto; padding: 20px; }

        /* כרטיס פרופיל/סטטוס */
        .profile-card { background: var(--card-bg); padding: 20px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        .nav { height: 70px; background: var(--card-bg); border-top: 1px solid rgba(128,128,128,0.1); display: flex; justify-content: space-around; align-items: center; padding-bottom: 5px; flex-shrink: 0; }
        .nav a { display: flex; flex-direction: column; align-items: center; color: var(--text-color); text-decoration: none; font-size: 11px; font-weight: 600; }
        .fab { width: 54px; height: 54px; background: var(--header-bg); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: -30px; }
    </style>
</head>
<body>
    <div class="phone" id="app-container">
        <div class="header">
            <span>GINGA</span>
            <button onclick="toggleTheme()" style="background: none; border: none; color: white; cursor: pointer;">
                <i data-lucide="sun-moon"></i>
            </button>
        </div>
        
        <div class="content">
            <div class="profile-card">
                <div>בוקר טוב, נועה</div>
                <div style="font-size: 12px; opacity: 0.7;">רמה 3 - מתחיל+</div>
                <div style="height: 8px; background: #eee; border-radius: 4px; margin-top: 10px;">
                    <div style="width: 70%; height: 100%; background: var(--accent); border-radius: 4px;"></div>
                </div>
            </div>

            <h3 style="margin-bottom: 15px;">הדרך שלך לפריסטייל</h3>
            <div class="profile-card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span>Double Touch</span>
                    <i data-lucide="play-circle" style="color: var(--accent);"></i>
                </div>
                <div style="font-size: 12px; opacity: 0.7;">+ XP 80</div>
            </div>
        </div>
        
        <nav class="nav">
            <a href="#"><i data-lucide="book-open"></i>תרגול</a>
            <a href="#"><i data-lucide="activity"></i>פעילות</a>
            <a href="#" class="fab"><i data-lucide="plus"></i></a>
            <a href="#"><i data-lucide="map-pin"></i>מפה</a>
            <a href="#"><i data-lucide="user"></i>פרופיל</a>
        </nav>
    </div>

    <script>
        lucide.createIcons();
        function toggleTheme() {
            const container = document.getElementById('app-container');
            const currentTheme = container.getAttribute('data-theme');
            container.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
        }
    </script>
</body>
</html>
