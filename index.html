<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>GINGA</title>
    <style>
        body { margin: 0; background-color: #EDE7DB; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; }
        
        .phone { width: 390px; height: 840px; background-color: #FDFBF7; border-radius: 40px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .header { background-color: #2D5A27; color: white; padding: 20px; text-align: center; font-weight: bold; }
        
        /* אזור הניווט החדש */
        .nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 70px;
            background-color: white;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="phone">
        <div class="header">GINGA</div>
        
        <!-- אזור הניווט -->
        <div class="nav">
            <div>בית</div>
            <div>מפה</div>
            <div>פרופיל</div>
        </div>
    </div>
</body>
</html>
