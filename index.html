<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GINGA</title>
    <style>
        /* הגדרות עיצוב כלליות */
        body {
            margin: 0;
            background-color: #EDE7DB; /* צבע רקע חיצוני */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
        }

        /* המסגרת של הטלפון */
        .phone {
            width: 390px;
            height: 840px;
            background-color: #FDFBF7;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* החלק העליון (Header) */
        .header {
            background-color: #2D5A27;
            color: white;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="phone">
        <div class="header">GINGA</div>
    </div>

</body>
</html>
