<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>GINGA</title>
    <!-- טעינת ספרית האייקונים Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { margin: 0; background-color: #EDE7DB; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Inter', sans-serif; }
        
        .phone { width: 390px; height: 840px; background-color: #FDFBF7; border-radius: 40px; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        .header { background-color: #2D5A27; color: white; padding: 20px; text-align: center; font-weight: 600; font-size: 18px; }
        
        /* אזור תוכן מרכזי */
        .content { flex: 1; display: flex; justify-content: center; align-items: center; color: #6B7789; }

        /* ניווט תחתון */
        .nav { height: 70px; background: white; border-top: 1px solid rgba(44,62,80,0.1); display: flex; justify-content: space-around; align-items: center; padding-bottom: 5px; }
        .nav a { display: flex; flex-direction: column; align-items: center; color: #6B7789; text-decoration: none; font-size: 11px; font-weight: 600; }
        .nav i { margin-bottom: 4px; }
        .fab { width: 54px; height: 54px; background: #2D5A27; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: -30px; box-shadow: 0 6px 15px rgba(45,90,39,0.3); }
    </style>
</head>
<body>
    <div class="phone">
        <div class="header">GINGA</div>
        <div class="content">מסך ראשי</div>
        
        <nav class="nav">
            <a href="#"><i data-lucide="book-open"></i>תרגול</a>
            <a href="#"><i data-lucide="activity"></i>פעילות</a>
            <a href="#" class="fab"><i data-lucide="plus"></i></a>
            <a href="#"><i data-lucide="map-pin"></i>מפה</a>
            <a href="#"><i data-lucide="user"></i>פרופיל</a>
        </nav>
    </div>

    <script>
        // מפעיל את האייקונים של Lucide
        lucide.createIcons();
    </script>
</body>
</html>
